server:
  port: 8081
spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:h2:mem:orders;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
